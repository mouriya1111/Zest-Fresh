      <text x="13" y="134">Sodium</text><text x="64" y="134" text-anchor="end" font-weight="700">30 mg</text><text x="69" y="134">Dietary Fibre</text><text x="122" y="134" text-anchor="end" font-weight="700">27.0 g</text>
    </g>
