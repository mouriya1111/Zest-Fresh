<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" width="136mm" height="206mm" viewBox="0 0 136 206">
  <title>ZestFresh Premium Red Chilli Powder - Luxury Back</title>
  <metadata>Flexible pouch panel. Artboard 136 x 206 mm. Trim 130 x 200 mm at x=3,y=3. Bleed 3 mm. Safe area 8 mm inside trim. Foil elements are isolated in GOLD_FOIL.</metadata>
  <defs><style>.sans{font-family:Arial,sans-serif}.serif{font-family:Georgia,'Times New Roman',serif}.ivory{fill:#f3eddf}.gold{fill:#c7a34d}.muted{fill:#c8c0b5}.tracked{letter-spacing:.55px}.guide{display:none;fill:none;stroke:#00a7ff;stroke-width:.2;stroke-dasharray:2 1}</style></defs>

  <g id="BACKGROUND" inkscape:groupmode="layer"><rect width="136" height="206" fill="#0c0b0c"/><rect y="128" width="136" height="78" fill="#5e0d1c"/></g>
  <g id="BRAND" inkscape:groupmode="layer">
    <g id="ZESTFRESH_LOGO">
      <path d="M68 11.24 C63.66 12.48,63.66 17.439999999999998,68 19.3 C72.34 17.439999999999998,72.34 12.48,68 11.24Z" fill="#c7a34d"/><path d="M66.388 13.719999999999999H69.674L66.326 16.82H69.612" fill="none" stroke="#5e0d1c" stroke-width="0.527"/>
      <text x="68" y="24" text-anchor="middle" class="serif ivory" font-size="7.2" font-weight="700">ZestFresh</text>
      <text x="68" y="28.3" text-anchor="middle" class="sans gold tracked" font-size="2.25">PURE SPICES  |  HONEST FLAVOR</text>
    </g><text x="11" y="42" class="serif ivory" font-size="7" font-weight="700">From the Heart of Guntur</text><path d="M11 47H36" stroke="#c7a34d" stroke-width=".45"/></g>
  <g id="STORY" inkscape:groupmode="layer"><text x="11" y="54" class="serif muted" font-size="1.82"><tspan x="11" dy="0">Our premium red chilli powder is crafted from carefully selected</tspan><tspan x="11" dy="3.15">chillies grown in the fertile lands of Guntur, nourished by the</tspan><tspan x="11" dy="3.15">Godavari river basin. This unique region is celebrated worldwide</tspan><tspan x="11" dy="3.15">for producing chillies with exceptional colour, rich aroma and</tspan><tspan x="11" dy="3.15">balanced heat. Every batch is carefully sourced, hygienically</tspan><tspan x="11" dy="3.15">processed and packed to preserve its natural freshness, authentic</tspan><tspan x="11" dy="3.15">flavour and vibrant red colour, bringing the true taste of Andhra</tspan><tspan x="11" dy="3.15">Pradesh to your kitchen.</tspan></text><g fill="none" stroke="#c7a34d"><circle cx="105" cy="54" r="8" fill="#8e1428" stroke="none"/><path d="M85 67H125" stroke-width=".5"/><path d="M105 67C105 77,88 87,88 99"/><path d="M105 67C105 77,96 87,96 99"/><path d="M105 67C105 77,104 87,104 99"/><path d="M105 67C105 77,112 87,112 99"/><path d="M105 67C105 77,120 87,120 99"/><path d="M105 67C105 77,126 87,126 99"/><path d="M86 75L124 77M86 82L124 84M86 89L124 91M86 96L124 98" stroke-width=".28"/><g stroke-width=".7"><circle cx="99" cy="75" r="1.25" fill="#c7a34d"/><path d="M99 76.5l1.6 6.5m-1.1-3l3.5 2m-2.4 1l-2 5m2-5l2.5 5"/><circle cx="114" cy="78" r="1.25" fill="#c7a34d"/><path d="M114 79.5l-1.6 6.5m1.1-3l-3.5 2m2.4 1l2 5m-2-5l-2.5 5"/></g></g><ellipse cx="89.4" cy="95" rx="1.4" ry=".7" fill="#8e1428"/><ellipse cx="93.4" cy="95" rx="1.4" ry=".7" fill="#8e1428"/><ellipse cx="97.4" cy="95" rx="1.4" ry=".7" fill="#8e1428"/><ellipse cx="101.4" cy="95" rx="1.4" ry=".7" fill="#8e1428"/><ellipse cx="105.4" cy="95" rx="1.4" ry=".7" fill="#8e1428"/><ellipse cx="109.4" cy="95" rx="1.4" ry=".7" fill="#8e1428"/><ellipse cx="113.4" cy="95" rx="1.4" ry=".7" fill="#8e1428"/><ellipse cx="117.4" cy="95" rx="1.4" ry=".7" fill="#8e1428"/><ellipse cx="121.4" cy="95" rx="1.4" ry=".7" fill="#8e1428"/><text x="105" y="104" text-anchor="middle" class="sans gold tracked" font-size="2.05" font-weight="700">GUNTUR  •  ANDHRA PRADESH</text></g>
  <g id="PRODUCT_INFORMATION" inkscape:groupmode="layer"><text x="11" y="110" class="sans gold" font-size="3.1" font-weight="700">INGREDIENTS</text><text x="11" y="117" class="serif ivory" font-size="3" font-weight="700">100% Premium Guntur Red Chillies</text><text x="73" y="110" class="sans gold" font-size="3.1" font-weight="700">STORAGE INSTRUCTIONS</text><text x="73" y="117" class="sans muted" font-size="2.4">Keep in a cool, dry place.</text><text x="73" y="121" class="sans muted" font-size="2.4">Away from moisture and direct sunlight.</text></g>
